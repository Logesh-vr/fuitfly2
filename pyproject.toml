[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-fruit-fly"
version = "0.1.0"
description = "Connectome brain and NeuroMechFly closed-loop experiments"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["virtual_fly*"]

[tool.setuptools.package-data]
virtual_fly = ["live.html", "static/*.js", "static/three/*.js", "static/three/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
